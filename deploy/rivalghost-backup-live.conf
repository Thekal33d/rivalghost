# Install as /etc/systemd/system/rivalghost-backup.service.d/database.conf
# after a coordinated live-state migration, then systemctl daemon-reload.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/rivalghost/current/deploy/backup-sqlite.py /var/lib/rivalghost/live.sqlite /var/backups/rivalghost
